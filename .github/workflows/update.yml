# Сбор расписания и публикация сайта.
#
# Сроки сбора: каждый день в 7:00 и в четверг в 20:00 по израильскому времени
# (круглый год, переход на зимнее время их не сдвигает).
#
# GitHub запускает workflow по расписанию с задержкой (на начале часа бывало
# по 5–7 часов) и не гарантирует время. Поэтому робот просыпается каждые
# полчаса в «некруглые» минуты, а scripts/due.py решает, наступил ли срок:
# если с последнего срока сбора ещё не было, собирает и публикует, иначе
# сразу завершается.
#
# По кнопке «Run workflow»: собрать (или только опубликовать, collect=false).
# При изменении кода (push в main): только пересобрать и опубликовать.

name: Update schedule and site

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      collect:
        description: "Collect fresh data (off = only republish the site)"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # продлевать расписание (см. шаг Keep schedule alive)

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      collect_failed: ${{ steps.collect.outcome == 'failure' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout data
        uses: actions/checkout@v4
        with:
          repository: gkrylov/netanya-cinema-data
          path: data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}

      - name: Decide what to do
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          COLLECT_INPUT: ${{ inputs.collect }}
        run: |
          case "$EVENT" in
            schedule)
              # системный python3 раннера: сборщики работают на стандартной библиотеке
              collect=$(GITHUB_OUTPUT= python3 scripts/due.py | tee /dev/stderr | sed -n 's/^collect=//p')
              publish=$collect ;;
            workflow_dispatch)
              collect=$COLLECT_INPUT; publish=true ;;
            *)
              collect=false; publish=true ;;
          esac
          echo "collect=$collect" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "collect=$collect publish=$publish"

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.publish == 'true'
        with:
          python-version: "3.13"

      - name: Restore IMDb ratings cache
        if: steps.plan.outputs.collect == 'true'
        uses: actions/cache@v4
        with:
          path: .cache
          key: imdb-${{ github.run_id }}
          restore-keys: imdb-

      # При ошибке не останавливаемся: сборщик уже записал её в data/status.md,
      # дальше коммит, публикация сайта с предупреждением, и только в конце
      # запуск помечается упавшим (шаг Report collection failure).
      - name: Collect schedule, movies and ratings
        id: collect
        if: steps.plan.outputs.collect == 'true'
        continue-on-error: true
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: python3 scripts/fetch_schedule.py

      - name: Commit data
        if: steps.plan.outputs.collect == 'true'
        working-directory: data
        run: |
          git config user.name "netanya-cinema bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Schedule update $(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M')"
            git pull --rebase   # заметки могли прийти, пока шёл сбор
            git push
          fi

      - name: Build site
        if: steps.plan.outputs.publish == 'true'
        run: python3 scripts/build_public.py

      # GitHub отключает запуски по расписанию после 60 дней без активности
      # в репозитории. Коммиты робота идут в репозиторий данных, не сюда,
      # поэтому при каждой публикации явно включаем workflow заново.
      - name: Keep schedule alive
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

      - uses: actions/upload-pages-artifact@v3
        if: steps.plan.outputs.publish == 'true'
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Report collection failure
        if: needs.build.outputs.collect_failed == 'true'
        run: |
          echo "::error::Collection failed; the site was published with a warning. See the 'Collect schedule' step of the build job."
          exit 1
